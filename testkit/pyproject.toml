[project]
name = "commonhill-testkit"
version = "0.1.0"
description = "Commonhill's Docker build harness for tests, a pytest plugin: mirrors, pinned downloads, retries, the build turn, busybox, compose jobs, scripted workers"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Blazelight Pty Ltd" }]
requires-python = ">=3.13"
dependencies = ["pytest>=9.1"]

[project.entry-points.pytest11]
commonhill_testkit = "commonhill_testkit"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
