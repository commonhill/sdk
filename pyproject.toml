#
# The sdk's workspace: the grader SDK (grader/, package commonhill-grader) and the tests' Docker build
# harness (testkit/, commonhill-testkit). The kits (kits/) and the vendoring tool (tools/) are files a
# project vendors or runs, not packages.
[project]
name = "commonhill-sdk"
version = "0.0.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "commonhill-grader",
    "commonhill-testkit",  # the Docker build harness the tests share, a pytest plugin (testkit/)
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1",
    "pytest-timeout>=2.4",  # a hung test fails with every thread's stack
    "pytest-xdist>=3.8",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["grader", "testkit"]

[tool.uv.sources]
commonhill-grader = { workspace = true }
commonhill-testkit = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["grader/src", "testkit/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.pyright]
include = ["grader", "kits", "testkit", "tools"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["grader/tests", "kits/insncap/tests", "kits/cycles/tests", "testkit/tests", "tools/tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
# A hung test fails with every thread's stack; the kits' Docker tests build QEMU and Valgrind.
timeout = 3600
timeout_method = "thread"
faulthandler_timeout = 3590
